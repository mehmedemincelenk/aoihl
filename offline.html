<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b3d35" />
    <title>Çevrimdışı — AİÖHL REHBERİN</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#14201d;background:#f2f6f4;font:15px/1.5 system-ui,sans-serif}.card{width:min(100%,430px);padding:25px;border:1px solid #d8e5e0;border-radius:20px;background:white;box-shadow:0 10px 32px rgba(13,57,49,.08)}.mark{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;color:#fff;background:#0b3d35;font-size:21px;font-weight:900}h1{margin:17px 0 7px;font-size:25px;line-height:1.1}p{margin:0;color:#65736e}button{margin-top:18px;padding:10px 14px;border:0;border-radius:10px;color:#fff;background:#17695d;font:inherit;font-weight:800;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <span class="mark" aria-hidden="true">A</span>
      <h1>Şu anda çevrimdışısın.</h1>
      <p>Daha önce açılan AİÖHL REHBERİN içeriği cihazında bulunabilir. Resmî dış bağlantıları açmak için internet bağlantısı gerekir.</p>
      <button type="button" onclick="location.reload()">Tekrar dene</button>
    </main>
  </body>
</html>
